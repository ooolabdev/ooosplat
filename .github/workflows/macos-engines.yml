name: macOS arm64 engine runtime

on:
  workflow_dispatch:
  push:
    tags:
      - engines-macos-arm64-v*

permissions:
  contents: write

jobs:
  build-engines:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Restore macOS build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            .cache/ccache
            .cache/macos-engine-build/sources
          key: macos-15-arm64-engines-${{ hashFiles('engines/manifest.macos.json', 'scripts/setup-macos-build-deps.sh', 'scripts/build-engines-macos.sh') }}

      - name: Install pinned build prerequisites
        run: bash scripts/setup-macos-build-deps.sh

      - name: Build and verify self-contained engines
        run: npm run build:engines:macos

      - name: Upload engine archive
        uses: actions/upload-artifact@v7
        with:
          name: ooosplat-engines-macos-arm64
          path: |
            dist-engines/*.tar.xz
            dist-engines/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable engine release assets
        if: startsWith(github.ref, 'refs/tags/engines-macos-arm64-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF_NAME}" = "$(node -e 'console.log(require("./engines/manifest.macos.json").distribution.tag)')"
          gh release create "$GITHUB_REF_NAME" \
            dist-engines/*.tar.xz dist-engines/*.sha256 \
            --title "OOOSplat macOS arm64 engines ${GITHUB_REF_NAME}" \
            --notes "Pinned Apple Silicon runtime for OOOSplat. Contains LGPL shared FFmpeg/FFprobe, CPU CLI-only COLMAP, Brush, build metadata, dependency inventory, and SHA-256 checksums."
