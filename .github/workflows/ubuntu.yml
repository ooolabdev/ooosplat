name: Ubuntu 24.04 Alpha

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential colmap curl ffmpeg file libvulkan1 mesa-vulkan-drivers \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests and build
        run: |
          npm test
          npm run build

      - name: Verify license metadata and mappings
        run: npm run verify:licenses

      - name: Install and verify bundled Brush
        run: |
          npm run setup:engines
          npm run verify:engines

      - name: Rust formatting, tests, and clippy
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: FFmpeg CLI integration
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=320x240:rate=10 -t 2 \
            -c:v mpeg4 /tmp/ooosplat-ci.mp4
          cargo run --manifest-path src-tauri/Cargo.toml --bin splatstudio -- \
            probe /tmp/ooosplat-ci.mp4
          cargo run --manifest-path src-tauri/Cargo.toml --bin splatstudio -- \
            extract /tmp/ooosplat-ci.mp4 /tmp/ooosplat-ci-frames --quality fast
          test "$(find /tmp/ooosplat-ci-frames -maxdepth 1 -name '*.jpg' | wc -l)" -gt 0

      - name: Build Ubuntu DEB package
        run: npm run tauri -- build --bundles deb

      - name: Verify Ubuntu DEB package
        run: |
          package="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          test -s "$package"
          test "$(dpkg-deb --field "$package" Architecture)" = "amd64"
          test "$(dpkg-deb --field "$package" Version)" = "0.2.0"
          dependencies="$(dpkg-deb --field "$package" Depends)"
          grep -Eq '(^|, )ffmpeg([ ,]|$)' <<<"$dependencies"
          grep -Eq '(^|, )colmap([ ,]|$)' <<<"$dependencies"
          extracted="$(mktemp -d)"
          trap 'rm -rf -- "$extracted"' EXIT
          dpkg-deb --extract "$package" "$extracted"
          test -n "$(find "$extracted" -type f -name ooo-splat -perm -111 -print -quit)"
          test -n "$(find "$extracted" -type f -path '*/engines/linux/brush/brush_app' -perm -111 -print -quit)"
          test -n "$(find "$extracted" -type f -path '*/engines/manifest.linux.json' -print -quit)"
          dpkg-deb --info "$package"

      - name: Package downloadable files
        run: |
          package="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          mkdir -p dist-artifacts
          cp "$package" dist-artifacts/OOOSplat_0.2.0_amd64.deb
          (cd dist-artifacts && sha256sum OOOSplat_0.2.0_amd64.deb > SHA256SUMS.txt)

      - name: Upload Ubuntu installer
        uses: actions/upload-artifact@v7
        with:
          name: OOOSplat-Ubuntu-24.04-x86_64-alpha
          path: dist-artifacts/
          if-no-files-found: error
          retention-days: 14
