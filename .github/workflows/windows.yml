name: Windows x64

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "assets/app-icon*.svg"
      - "config/**"
      - "db/**"
      - "engines/**"
      - "html-viewer/**"
      - "scripts/**"
      - "server/**"
      - "licenses/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tsconfig*.json"
      - "vite.config.*"
      - "vitest.config.*"
      - "rust-toolchain.toml"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "assets/app-icon*.svg"
      - "config/**"
      - "db/**"
      - "engines/**"
      - "html-viewer/**"
      - "scripts/**"
      - "server/**"
      - "licenses/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tsconfig*.json"
      - "vite.config.*"
      - "vitest.config.*"
      - "rust-toolchain.toml"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup component add rustfmt clippy
          rustup show active-toolchain
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend, runtime policy, and license checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run verify:telemetry:release
          npm test
          npm run test:engine-scripts
          npm run verify:colmap-lock
          npm run build
          npm run verify:bundle-resources
          npm run verify:licenses

      - name: Install and verify pinned engines
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run setup:engines
          npm run verify:engines
          node scripts/smoke-ffmpeg-windows.mjs engines/ffmpeg
          node scripts/smoke-colmap-image-io.mjs engines/colmap/bin/colmap.exe

      - name: Rust formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Windows NSIS installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: npm run package:windows

      - name: Verify packaged COLMAP resources and installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $runtime = 'engines/colmap'
          foreach ($relative in @(
            'bin/colmap.exe',
            'lib/colmap/vocab_tree_faiss_flickr100K_words256K.bin',
            'BUILD-INFO.json',
            'BUNDLED-COMPONENTS.json',
            'SHA256SUMS'
          )) {
            $target = Join-Path $runtime $relative
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "Missing packaged input: $target" }
          }
          $installer = Get-ChildItem -LiteralPath dist-artifacts -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer -or $installer.Length -eq 0) { throw 'Missing NSIS installer.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'ooosplat-package-inspection'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "NSIS silent install failed with $($process.ExitCode)" }
          foreach ($relative in @(
            'engines/colmap/bin/colmap.exe',
            'engines/colmap/lib/colmap/vocab_tree_faiss_flickr100K_words256K.bin',
            'engines/colmap/BUILD-INFO.json',
            'engines/colmap/BUNDLED-COMPONENTS.json'
          )) {
            $target = Join-Path $installDir $relative
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "Installed NSIS package is missing $relative" }
          }

      - name: Upload Windows installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: OOOSplat-${{ github.run_number }}-x64-windows
          path: dist-artifacts/
          if-no-files-found: error
          retention-days: 14
