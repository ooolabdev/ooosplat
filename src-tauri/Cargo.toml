[package]
name = "ooo-splat"
version = "0.2.0"
description = "Local video-to-Gaussian-Splatting pipeline for Windows, Apple Silicon macOS Alpha, and Ubuntu 24.04 Alpha"
authors = ["ooolabdev"]
license = "Apache-2.0"
repository = "https://github.com/ooolabdev/ooosplat"
homepage = "https://github.com/ooolabdev/ooosplat"
edition = "2021"
default-run = "ooo-splat"

[lib]
name = "ooo_splat"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ooo-splat"
path = "src/main.rs"

[[bin]]
name = "splatstudio"
path = "src/bin/splatstudio.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
trash = "5.2"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
